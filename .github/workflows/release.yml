name: Signed desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple silicon
            runner: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --config src-tauri/tauri.macos.conf.json
          - label: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json
          - label: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --config src-tauri/tauri.windows.conf.json

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        run: pnpm typecheck && pnpm test && pnpm build

      - name: Build and upload signed updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.runner, 'macos') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: MineTrace v__VERSION__
          releaseBody: Download the installer for your platform. MineTrace verifies every in-app update with its embedded updater public key.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
