name: Signed desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      WINDOWS_CERTIFICATE_CONFIGURED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple silicon
            runner: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --config src-tauri/tauri.macos.conf.json
          - label: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.release.conf.json
          - label: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --config src-tauri/tauri.windows.release.conf.json

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY) { console.error('TAURI_SIGNING_PRIVATE_KEY is required'); process.exit(1); }"

      - name: Prepare Windows Authenticode signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $source = "src-tauri/tauri.windows.conf.json"
          $destination = "src-tauri/tauri.windows.release.conf.json"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Copy-Item -LiteralPath $source -Destination $destination
            Write-Warning "No Authenticode certificate is configured. This release retains Windows SmartScreen preview status."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE is configured."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "minetrace-windows-signing.pfx"
          [System.IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificates = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          Remove-Item -LiteralPath $certificatePath -Force
          $certificate = $certificates | Where-Object HasPrivateKey | Select-Object -First 1
          if ($null -eq $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
            throw "The Windows Authenticode certificate could not be imported."
          }

          $config = Get-Content -LiteralPath $source -Raw | ConvertFrom-Json
          $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $certificate.Thumbprint -Force
          $config.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue "sha256" -Force
          $config.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue "http://timestamp.digicert.com" -Force
          $config.bundle.windows | Add-Member -NotePropertyName tsp -NotePropertyValue $true -Force
          [System.IO.File]::WriteAllText(
            $destination,
            ($config | ConvertTo-Json -Depth 20),
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Run frontend checks
        run: pnpm typecheck && pnpm test && pnpm build

      - name: Build and upload signed updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.runner, 'macos') && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: MineTrace v__VERSION__
          releaseBody: Download the installer for your platform. MineTrace verifies every in-app update with its embedded updater public key.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_CONFIGURED == 'true'
        shell: pwsh
        run: |
          $releaseRoot = "src-tauri/target/${{ matrix.target }}/release"
          $artifacts = @((Join-Path $releaseRoot "minetrace.exe")) + @(
            Get-ChildItem -LiteralPath (Join-Path $releaseRoot "bundle") -Recurse -File |
              Where-Object { $_.Extension -in @(".exe", ".msi") } |
              Select-Object -ExpandProperty FullName
          )
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Authenticode verification failed for ${artifact}: $($signature.Status)."
            }
            Write-Host "Verified Authenticode signature: $artifact"
          }

      - name: Attest Windows build provenance
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            src-tauri/target/${{ matrix.target }}/release/minetrace.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

      - name: Attest macOS build provenance
        if: runner.os == 'macOS'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  finalize:
    name: Verify and publish release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify updater manifest and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          mkdir -p "$RUNNER_TEMP/minetrace-release"
          gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP/minetrace-release"
          node - "$RUNNER_TEMP/minetrace-release/latest.json" "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const [manifestPath, expectedVersion] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const platforms = Object.values(manifest.platforms ?? {});
          if (manifest.version !== expectedVersion || platforms.length < 3) {
            throw new Error('latest.json is missing the expected version or desktop platforms');
          }
          for (const platform of platforms) {
            if (!platform.url || !platform.signature) {
              throw new Error('latest.json contains an unsigned or missing updater payload');
            }
          }
          NODE
          gh release edit "$TAG" --draft=false --latest
