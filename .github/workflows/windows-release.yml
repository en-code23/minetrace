name: Windows release validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-release.yml"
      - "src/**"
      - "src-tauri/**"
      - "scripts/build-windows.ps1"
      - "scripts/verify-windows.ps1"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-release.yml"
      - "src/**"
      - "src-tauri/**"
      - "scripts/build-windows.ps1"
      - "scripts/verify-windows.ps1"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.label }} installers
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: X64
            label: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: MineTrace-windows-x64-unsigned
          - architecture: Arm64
            label: ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: MineTrace-windows-arm64-unsigned

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt --target ${{ matrix.target }}
          rustup default 1.97.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and smoke-test unsigned installers
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Mode Local -Architecture ${{ matrix.architecture }} -UpgradeSmokeInstall

      - name: Collect startup diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "minetrace-startup"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $logRoot = Join-Path $env:LOCALAPPDATA "com.minetrace.desktop\logs"
          if (Test-Path -LiteralPath $logRoot) {
            Copy-Item -LiteralPath $logRoot -Destination $destination -Recurse -Force
          }

      - name: Upload startup diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MineTrace-${{ matrix.label }}-startup-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/minetrace-startup/**

      - name: Upload verified Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/minetrace.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/SHA256SUMS.txt
